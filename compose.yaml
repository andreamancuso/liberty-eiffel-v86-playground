name: liberty-eiffel-v86-playground
services:
  web:
    image: nginx:1.28-alpine
    ports:
      - "127.0.0.1:${PLAYGROUND_PORT:-8082}:8080"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./artifacts:/assets:ro
      - ./examples:/examples:ro
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
